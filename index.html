<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EloFit: disciplina, hidratação e treino em um só lugar.">
    <meta name="theme-color" content="#ff7b00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EloFit">
    <title>EloFit</title>
    <link rel="icon" href="img/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div id="tela-login">
        <div class="login-card">
            <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 18px;">
                <img src="img/mascote.png" alt="Mascote EloFit" style="width: 90px; object-fit: contain;">
            </div>
            <h1>EloFit</h1>
            <p>Disciplina, Hidratação e Treino em um só lugar.</p>
            <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <button id="btn-entrar" class="btn-acao" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(135deg, #ff8a1a, #ff7b00); color: white; border: none; box-shadow: 0 12px 24px rgba(255, 123, 0, 0.22); border-radius: 12px; font-size: 1.02rem; font-weight: 700; letter-spacing: 0.01em;">
                    Entrar
                </button>
                <button id="btn-entrar-google" class="btn-acao" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(135deg, #ffffff, #f8fafc); color: #1f2937; border: 1px solid #dbeafe; box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08); border-radius: 12px; font-size: 1rem; font-weight: 600;">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                    Entrar com o Google
                </button>
                <button id="btn-instalar-app" type="button" hidden style="width: 100%; background: #0f172a; color: white; border: none; border-radius: 12px; padding: 12px; font-weight: 700; cursor: pointer;">
                    Instalar o app
                </button>
            </div>
        </div>
    </div>

    <div id="app-principal" style="display: none; width: 100%;">
        <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            <div id="logo-home" title="Voltar ao Login" style="display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 6px 10px; border-radius: 10px; transition: all 0.2s ease; user-select: none;">
                <img src="img/mascote.png" alt="Mascote EloFit" style="height: 38px; object-fit: contain;">
            </div>

            <nav style="display: flex; gap: 8px; align-items: center;">
                <button id="btn-agua" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; font-weight: bold; transition: 0.2s ease;">💧 Água</button>
                <button id="btn-treino" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; font-weight: bold; transition: 0.2s ease;">🏋️ Treino</button>
                <button id="btn-corrida" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; font-weight: bold; transition: 0.2s ease;">🏃‍♂️ Corrida</button>
                <button id="btn-sair" style="padding: 8px 12px; border-radius: 8px; border: none; background: linear-gradient(135deg, #ea4335, #d93025); color: white; cursor: pointer; font-weight: bold; box-shadow: 0 2px 8px rgba(217,48,37,0.25); transition: 0.2s ease;">Sair</button>
            </nav>
            
        </header>

        <main id="conteudo-principal" style="padding: 20px; display: flex; justify-content: center;">
            </main>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
        let deferredPrompt = null;
        const installButton = document.getElementById('btn-instalar-app');
        const isSecureContext = window.isSecureContext || location.hostname === 'localhost' || location.hostname === '127.0.0.1';

        if ('serviceWorker' in navigator && isSecureContext) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('./sw.js');
                    if (registration.waiting) {
                        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }

                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        window.location.reload();
                    });
                } catch (error) {
                    console.warn('Service Worker não disponível:', error);
                }
            });
        } else if (installButton) {
            installButton.hidden = true;
            console.warn('Instalação PWA bloqueada: contexto não seguro. Use HTTPS ou localhost.');
        }

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredPrompt = event;

            if (installButton) {
                installButton.hidden = false;
                installButton.onclick = async () => {
                    if (!deferredPrompt) return;
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log('Instalação do app:', outcome);
                    deferredPrompt = null;
                    installButton.hidden = true;
                };
            }
        });

        window.addEventListener('appinstalled', () => {
            if (installButton) installButton.hidden = true;
            console.log('App instalado com sucesso');
        });
    </script>
</body>
</html>
