<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EloFit</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff7b00">
</head>
<body>

    <div id="tela-login">
        <div class="login-card">
            <img src="img/logo.png" alt="EloFit Logo" style="width: 120px; margin-bottom: 15px; object-fit: contain;">
            <h1>EloFit</h1>
            <p>Disciplina, Hidratação e Treino em um só lugar.</p>
            <button id="btn-entrar" class="btn-acao" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; color: #333; border: 1px solid #cbd5e1;">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                Entrar com o Google
            </button>
        </div>
    </div>

    <div id="app-principal" style="display: none; width: 100%;">
        <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            <div style="display: flex; align-items: center; gap: 10px; cursor: pointer;" id="logo-home" title="Voltar ao Login">
                <img src="img/logo.png" alt="EloFit Logo" style="height: 35px; object-fit: contain;">
                <img src="img/mascote.png" alt="Mascote EloFit" style="height: 38px; object-fit: contain;">
            </div>
            
            <nav style="display: flex; gap: 8px; align-items: center;">
                <button id="btn-agua" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; font-weight: bold;">💧 Água</button>
                <button id="btn-treino" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; font-weight: bold;">🏋️ Treino</button>
                <button id="btn-sair" style="padding: 6px 10px; border-radius: 6px; border: none; background: #ea4335; color: white; cursor: pointer; font-weight: bold;">Sair</button>
            </nav>
        </header>

        <main id="conteudo-principal" style="padding: 20px; display: flex; justify-content: center;">
            </main>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
